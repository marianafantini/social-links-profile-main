<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Social links profile</title>

</head>
<body>

<section class="content-wrapper">
    <div class="profile">

        <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall's avatar" class="profile-image">

        <h1 class="title">Jessica Randall</h1>

        <p class="location">London, United Kingdom</p>
        <p class="description">"Front-end developer and avid reader."</p>

        <div class="buttons-wrapper">
            <button>GitHub</button>
            <button>Frontend Mentor</button>
            <button>LinkedIn</button>
            <button>Twitter</button>
            <button>Instagram</button>
        </div>
    </div>
</section>

<div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://www.linkedin.com/in/marianafantini/">marianafantini</a>.
</div>
</body>
</html>
